<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Goa Tour Travel</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
  <nav class="navbar">cd backend
    npm run dev
    <div class="container">
      <a href="index.html" class="navbar-brand">Goa Tour Travel</a>
      <div class="hamburger" id="hamburger">☰</div>
      <ul class="navbar-nav" id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li>
          <a href="#" id="notification-btn" class="notification-icon" title="Booking Notifications">
            🔔 <span class="notification-badge" id="notification-badge" style="display:none;">0</span>
          </a>
        </li>
        <li><a href="#" id="logout-btn" class="btn btn-danger" style="margin-left: 20px;">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="#" class="active" id="nav-profile">Profile</a></li>
        <li><a href="#" id="nav-bookings">My Bookings</a></li>
        <li><a href="packages.html">Explore Packages</a></li>
      </ul>
    </div>

    <div class="main-content">
      <div class="dashboard-header">
        <h2 id="welcome-text">Welcome!</h2>
      </div>

      <!-- Profile Section -->
      <div id="section-profile" class="dashboard-section">
        <div class="profile-card"
          style="display: flex; gap: 20px; align-items: flex-start; padding: 25px; background: white; border-radius: 8px; border: 1px solid #eee;">

          <div style="flex-shrink: 0; text-align: center;">
            <img id="dashboard-avatar-preview" src=""
              style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #eee; border: 3px solid var(--primary-color); display: none;">
            <div id="dashboard-avatar-initials"
              style="width: 100px; height: 100px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin: 0 auto;">
            </div>
            <p style="margin-top: 10px; font-size: 0.85rem; color: #888;">Profile Photo</p>
          </div>

          <div style="flex-grow: 1;">
            <h3 style="margin-top: 0;">Your Information</h3>
            <hr style="margin: 10px 0 15px 0; border: 0; border-top: 1px solid #eee;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
              <p style="margin: 0;"><strong>Name:</strong> <span id="profile-name"></span></p>
              <p style="margin: 0;"><strong>Email:</strong> <span id="profile-email"></span></p>
              <p style="margin: 0;"><strong>Phone:</strong> <span id="profile-phone"></span></p>
              <p style="margin: 0;"><strong>Role:</strong> <span id="profile-role"
                  style="text-transform: capitalize;"></span></p>
            </div>

            <div style="margin-top: 15px;">
              <p style="margin: 0 0 10px 0;"><strong>Address:</strong> <span id="profile-address"></span></p>
              <p style="margin: 0;"><strong>About You:</strong> <span id="profile-about"
                  style="display: block; margin-top: 5px; color: #555; line-height: 1.5;"></span></p>
            </div>
          </div>

        </div>
      </div>

      <!-- My Bookings Section -->
      <div id="section-bookings" class="dashboard-section" style="display: none;">
        <h3>My Bookings</h3>
        <div style="overflow-x: auto; margin-top: 20px;">
          <table class="bookings-table">
            <thead>
              <tr>
                <th>Package</th>
                <th>Travel Date</th>
                <th>Persons</th>
                <th>Status</th>
                <th>Booked On</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/userDashboard.js"></script>
</body>

</html>
